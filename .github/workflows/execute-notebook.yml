name: Execute PNAD notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,notebooks]'
      - name: Inspect refined database schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=sorted(Path('dados_refined').glob('pnad_refined_*.parquet'))
          print('NUMBER_OF_FILES', len(files))
          schemas={}
          for file in files:
              cols=tuple(pd.read_parquet(file).columns.tolist())
              schemas.setdefault(cols, []).append(file.name)
          for cols,names in schemas.items():
              print('SCHEMA', cols, 'FIRST', names[0], 'LAST', names[-1], 'COUNT', len(names))
          PY
      - name: Run tests
        run: pytest -q
      - name: Execute notebook
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute pnad_income_pipeline.ipynb --output pnad_income_pipeline_executed.ipynb --ExecutePreprocessor.timeout=1200
      - name: Extract notebook results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path('notebooks/pnad_income_pipeline_executed.ipynb').read_text(encoding='utf-8'))
          blocks=[]
          for i,cell in enumerate(nb.get('cells',[]),1):
              if cell.get('cell_type')!='code':
                  continue
              blocks.append(f'\n=== CODE CELL {i} ===\n')
              for item in cell.get('outputs',[]):
                  if item.get('output_type')=='stream':
                      text=item.get('text','')
                      blocks.append(''.join(text) if isinstance(text,list) else text)
                  data=item.get('data',{})
                  if 'text/plain' in data:
                      text=data['text/plain']
                      blocks.append((''.join(text) if isinstance(text,list) else text)+'\n')
          text=''.join(blocks)
          Path('notebook_output.txt').write_text(text,encoding='utf-8')
          print(text)
          PY
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: pnad-notebook-execution
          path: |
            notebooks/pnad_income_pipeline_executed.ipynb
            notebook_output.txt
