name: Execute PNAD notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,notebooks]'
      - name: Inspect refined database schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=sorted(Path('dados_refined').glob('pnad_refined_*.parquet'))
          print('NUMBER_OF_FILES', len(files))
          for file in [files[0], files[len(files)//2], files[-10], files[-1]]:
              df=pd.read_parquet(file)
              print(file.name, 'shape=', df.shape, 'columns=', df.columns.tolist())
              print(df.head(2).to_string())
          print('UNIQUE_SCHEMAS')
          schemas={}
          for file in files:
              cols=tuple(pd.read_parquet(file).columns.tolist())
              schemas.setdefault(cols, []).append(file.name)
          for cols,names in schemas.items():
              print(cols, names[0], '...', names[-1], 'count=', len(names))
          PY
      - name: Run tests
        run: pytest -q
      - name: Execute notebook
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute pnad_income_pipeline.ipynb --output pnad_income_pipeline_executed.ipynb --ExecutePreprocessor.timeout=1200
