name: Run notebook and persist outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'outputs/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: pnad-notebook-main
  cancel-in-progress: false

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: pip install -e '.[dev,notebooks]'

      - name: Run tests
        run: pytest -q

      - name: Prepare output directories
        run: mkdir -p outputs/figures outputs/tables outputs/reports

      - name: Execute notebook and persist scientific outputs
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute pnad_income_pipeline.ipynb \
            --output ../outputs/reports/pnad_income_pipeline_executed.ipynb \
            --ExecutePreprocessor.timeout=1800

      - name: Export advanced inequality indices
        run: python scripts/export_advanced_inequality.py

      - name: Render executed notebook to HTML
        run: |
          jupyter nbconvert \
            --to html \
            outputs/reports/pnad_income_pipeline_executed.ipynb \
            --output pnad_income_pipeline_executed.html \
            --output-dir outputs/reports

      - name: Audit output tree
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path('outputs/manifest.csv'),
              Path('outputs/tables/pipeline_overview.csv'),
              Path('outputs/tables/annual_summary.csv'),
              Path('outputs/tables/annual_inequality_indices.csv'),
              Path('outputs/tables/ccdf_nominal_adjusted.parquet'),
              Path('outputs/tables/data_quality_diagnostics.csv'),
              Path('outputs/figures/inequality_indices_all_years.png'),
              Path('outputs/figures/zanardi_index_all_years.png'),
              Path('outputs/reports/pnad_income_pipeline_executed.ipynb'),
              Path('outputs/reports/pnad_income_pipeline_executed.html'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          figures = list(Path('outputs/figures').glob('*.png'))
          print('FIGURE_COUNT', len(figures))
          print('MISSING_REQUIRED', missing)
          if missing:
              raise SystemExit(1)
          if len(figures) < 26:
              raise SystemExit(f'Expected at least 26 figures, found {len(figures)}')
          PY

      - name: Upload outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnad-complete-outputs
          path: outputs/
          if-no-files-found: error

      - name: Commit generated outputs to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/manifest.csv outputs/figures outputs/tables outputs/reports
          if git diff --cached --quiet; then
            echo 'No generated output changes to commit.'
            exit 0
          fi
          git commit -m 'update generated PNAD outputs [skip ci]'
          git push origin HEAD:main
