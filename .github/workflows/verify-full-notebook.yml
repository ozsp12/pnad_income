name: Verify full PNAD notebook

on:
  push:
    branches: [main]

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e '.[dev,notebooks]'
      - name: Run tests
        run: pytest -q
      - name: Execute full notebook
        working-directory: notebooks
        run: |
          jupyter nbconvert --to notebook --execute pnad_income_pipeline.ipynb --output pnad_income_pipeline_executed.ipynb --ExecutePreprocessor.timeout=1800
      - name: Audit rendered outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path('notebooks/pnad_income_pipeline_executed.ipynb').read_text(encoding='utf-8'))
          image_outputs=[]
          for i,cell in enumerate(nb.get('cells',[]),1):
              for out in cell.get('outputs',[]):
                  if 'image/png' in out.get('data',{}):
                      image_outputs.append(i)
          print('IMAGE_OUTPUT_COUNT', len(image_outputs))
          print('IMAGE_OUTPUT_CELLS', image_outputs)
          print('EXECUTED_CODE_CELLS', sum(1 for c in nb['cells'] if c.get('cell_type')=='code' and c.get('execution_count') is not None))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pnad-full-notebook
          path: notebooks/pnad_income_pipeline_executed.ipynb
