name: One-shot loop engineering refactor

on:
  push:
    branches: [loop-engineering-eda]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  refactor-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply repository refactor
        run: python scripts/refactor_loop_engineering.py

      - name: Install refactored project
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Execute full pipeline in temporary output tree
        run: |
          rm -rf /tmp/pnad-loop-engineering-outputs
          pnad-income \
            --database dados_refined \
            --output /tmp/pnad-loop-engineering-outputs \
            --start-year 1976 \
            --end-year 2025 \
            --ccdf-base 1.05 \
            --histogram-bins 100
          test -f /tmp/pnad-loop-engineering-outputs/tables/eda/outlier_diagnostics.csv
          test -f /tmp/pnad-loop-engineering-outputs/tables/eda/sentinel_candidates.csv
          test -f /tmp/pnad-loop-engineering-outputs/figures/eda/boxplots/boxplot_income_page_01.png
          test -f /tmp/pnad-loop-engineering-outputs/figures/paper/ccdf/ccdf_income_loglog_page_01.png
          test -f /tmp/pnad-loop-engineering-outputs/figures/paper/ccdf/ccdf_income_gompertz_page_01.png

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md pyproject.toml src tests .github/workflows/run-pipeline-and-persist-outputs.yml
          git add -u -- src/pnad_income scripts/refactor_loop_engineering.py .github/workflows/refactor-loop-engineering.yml
          if git diff --cached --quiet; then
            echo 'No refactor changes to commit.'
            exit 0
          fi
          git commit -m 'refactor EDA, CCDF diagnostics, and repository layout [skip ci]'
          git push origin HEAD:loop-engineering-eda
