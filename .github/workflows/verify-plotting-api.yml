name: Verify plotting API

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,notebooks]'
      - run: pytest -q
      - name: Smoke-test plotting API
        run: |
          python - <<'PY'
          import matplotlib
          matplotlib.use('Agg')
          import pandas as pd
          from pnad_income.distributions import build_ccdf_by_year
          from pnad_income.plotting import plot_histogram, plot_histogram_grid, plot_ccdf, plot_ccdf_grid, plot_lorenz_curve, plot_lorenz_grid

          panel = pd.DataFrame({
              'year': [2001,2001,2005,2005,2010,2010,2020,2020,2025,2025],
              'income': [0,10,1,20,2,30,3,40,4,50],
          })
          ccdf = build_ccdf_by_year(panel, value_col='income')

          assert len(plot_histogram(panel, year=2025).axes) == 1
          assert len(plot_ccdf(ccdf, year=2020, measure='income').axes) == 1
          assert len(plot_lorenz_curve(panel, year=2010).axes) == 1

          figs = plot_histogram_grid(panel, years=[2001,2005,2010,2020], nrows=2, ncols=2)
          assert len(figs) == 1 and len(figs[0].axes) == 4

          figs = plot_ccdf_grid(ccdf, years=[2001,2005,2010,2020,2025], nrows=1, ncols=2)
          assert len(figs) == 3 and all(len(fig.axes) == 2 for fig in figs)

          figs = plot_lorenz_grid(panel, years=[2005,2020,2025], nrows=1, ncols=3)
          assert len(figs) == 1 and len(figs[0].axes) == 3
          print('PLOTTING_API_OK')
          PY
