name: Run pipeline and persist outputs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'outputs/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: pnad-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # LOOP_ENGINEERING_BOOTSTRAP_START
      - name: Apply one-shot loop engineering refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'loop-engineering-eda' && hashFiles('scripts/refactor_loop_engineering.py') != ''
        run: |
          python scripts/refactor_loop_engineering.py
          git checkout HEAD -- .github/workflows/run-pipeline-and-persist-outputs.yml .github/workflows/refactor-loop-engineering.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md pyproject.toml src tests scripts
          if ! git diff --cached --quiet; then
            git commit -m 'refactor EDA, CCDF diagnostics, and repository layout [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
      # LOOP_ENGINEERING_BOOTSTRAP_END

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Prepare clean output directories
        if: github.event_name != 'pull_request'
        run: |
          rm -rf outputs/figures outputs/tables outputs/reports outputs/manifest.csv
          mkdir -p outputs/figures outputs/tables

      - name: Execute analysis pipeline
        if: github.event_name != 'pull_request'
        run: |
          python -m pnad_income \
            --database dados_refined \
            --output outputs \
            --start-year 1976 \
            --end-year 2025 \
            --ccdf-base 1.05 \
            --histogram-bins 100

      - name: Audit output tree
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path('outputs/manifest.csv'),
              Path('outputs/tables/pipeline_overview.csv'),
              Path('outputs/tables/annual_summary.csv'),
              Path('outputs/tables/annual_inequality_indices.csv'),
              Path('outputs/tables/ccdf_nominal_adjusted.parquet'),
              Path('outputs/tables/data_quality_diagnostics.csv'),
              Path('outputs/figures/gini_income_all_years.png'),
              Path('outputs/figures/inequality_indices_all_years.png'),
              Path('outputs/figures/zanardi_index_all_years.png'),
              Path('outputs/figures/histogram_income_log_frequency_page_01.png'),
              Path('outputs/figures/ccdf_income_loglog_page_01.png'),
              Path('outputs/figures/ccdf_income_gompertz_page_01.png'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          figures = list(Path('outputs/figures').glob('*.png'))
          forbidden = [
              Path('outputs/reports'),
              *Path('outputs/figures').glob('*_linear*.png'),
              *Path('outputs/figures').glob('*double_log_legacy*.png'),
          ]
          forbidden_existing = [str(path) for path in forbidden if path.exists()]
          print('FIGURE_COUNT', len(figures))
          print('MISSING_REQUIRED', missing)
          print('FORBIDDEN_OUTPUTS', forbidden_existing)
          if missing:
              raise SystemExit(1)
          if forbidden_existing:
              raise SystemExit(1)
          if len(figures) < 20:
              raise SystemExit(f'Expected at least 20 figures, found {len(figures)}')
          PY

      - name: Upload outputs as workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pnad-complete-outputs
          path: outputs/
          if-no-files-found: error

      - name: Commit generated outputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/manifest.csv outputs/figures outputs/tables
          if git diff --cached --quiet; then
            echo 'No generated output changes to commit.'
            exit 0
          fi
          git commit -m 'update generated PNAD outputs [skip ci]'
          git push origin HEAD:main
