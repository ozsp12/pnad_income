name: Run pipeline and persist outputs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'outputs/**'
      - 'data/trusted/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: pnad-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Select generated-data roots
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TRUSTED_ROOT=/tmp/pnad-trusted" >> "$GITHUB_ENV"
            echo "OUTPUT_ROOT=/tmp/pnad-outputs" >> "$GITHUB_ENV"
          else
            echo "TRUSTED_ROOT=data/trusted" >> "$GITHUB_ENV"
            echo "OUTPUT_ROOT=outputs" >> "$GITHUB_ENV"
          fi

      - name: Prepare clean generated-data roots
        run: |
          rm -rf "$OUTPUT_ROOT"
          mkdir -p "$OUTPUT_ROOT/figures" "$OUTPUT_ROOT/tables"
          mkdir -p "$TRUSTED_ROOT"
          rm -f "$TRUSTED_ROOT"/pnad_trusted_*.parquet

      - name: Build trusted data and execute analysis pipeline
        run: |
          pnad-income \
            --refined data/refined \
            --trusted "$TRUSTED_ROOT" \
            --metadata data/metadata/pnad_metadata.csv \
            --gini-references data/metadata/series_ipea_banco_mundial.csv \
            --output "$OUTPUT_ROOT" \
            --start-year 1976 \
            --end-year 2025 \
            --ccdf-base 1.05 \
            --regime-min-body 100 \
            --regime-min-tail 100 \
            --regime-min-tail-fraction 0.01 \
            --regime-cutoff-quantile-min 0.80 \
            --regime-cutoff-quantile-max 0.99 \
            --regime-selection-criterion bic \
            --histogram-bins 100 \
            --plot-columns 3 \
            --outlier-method log_mad \
            --outlier-threshold 6

      - name: Audit trusted data and flat output tree
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          output_root = Path(os.environ['OUTPUT_ROOT'])
          trusted_root = Path(os.environ['TRUSTED_ROOT'])

          required = [
              output_root / 'manifest.csv',
              output_root / 'tables/eda_cleaning_audit.csv',
              output_root / 'tables/eda_cleaning_thresholds.csv',
              output_root / 'tables/eda_refined_descriptive_statistics.csv',
              output_root / 'tables/eda_trusted_descriptive_statistics.csv',
              output_root / 'tables/paper_pipeline_overview.csv',
              output_root / 'tables/paper_annual_summary.csv',
              output_root / 'tables/paper_annual_inequality_indices.csv',
              output_root / 'tables/paper_annual_income_groups_p80_p99_p100_2025_usd.csv',
              output_root / 'tables/paper_gini_external_references.csv',
              output_root / 'tables/paper_gini_external_comparison.csv',
              output_root / 'tables/paper_ccdf_income_nominal_adjusted.parquet',
              output_root / 'tables/paper_distribution_regime_fits.csv',
              output_root / 'tables/paper_distribution_regime_curves.parquet',
              output_root / 'figures/eda_refined_histogram_income_page_01.png',
              output_root / 'figures/eda_trusted_histogram_income_page_01.png',
              output_root / 'figures/eda_refined_boxplot_income_page_01.png',
              output_root / 'figures/eda_trusted_boxplot_income_page_01.png',
              output_root / 'figures/eda_refined_outlier_income_upper_tail_all_years.png',
              output_root / 'figures/eda_trusted_outlier_income_upper_tail_all_years.png',
              output_root / 'figures/eda_compare_outlier_income_upper_tail_refined_trusted.png',
              output_root / 'figures/paper_ccdf_income_loglog_page_01.png',
              output_root / 'figures/paper_ccdf_income_gompertz_page_01.png',
              output_root / 'figures/paper_lorenz_income_annotated_g_p_k_z_page_01.png',
              output_root / 'figures/paper_inequality_gini_all_years.png',
              output_root / 'figures/paper_income_groups_p80_p99_p100_absolute_2025_usd_all_years.png',
              output_root / 'figures/paper_gini_external_validation.png',
              output_root / 'figures/paper_distribution_regime_fit_page_01.png',
              output_root / 'figures/paper_gompertz_parameter_B_all_years.png',
              output_root / 'figures/paper_pareto_alpha_all_years.png',
              output_root / 'figures/paper_distribution_cutoff_all_years.png',
              output_root / 'figures/paper_distribution_regime_r2_all_years.png',
          ]
          missing = [str(path) for path in required if not path.exists()]
          figures = list((output_root / 'figures').glob('*.png'))
          nested_output_dirs = [
              str(path)
              for root in (output_root / 'figures', output_root / 'tables')
              for path in root.iterdir()
              if path.is_dir()
          ]
          trusted_files = sorted(trusted_root.glob('pnad_trusted_*.parquet'))
          wrong_names = [
              path.name
              for path in [*(output_root / 'figures').glob('*'), *(output_root / 'tables').glob('*')]
              if path.is_file() and not path.name.startswith(('eda_', 'paper_'))
          ]
          forbidden_unannotated_lorenz = [
              path.name
              for path in (output_root / 'figures').glob('paper_lorenz_income_*.png')
              if 'annotated_g_p_k_z' not in path.name
          ]

          manifest_columns = [
              'category',
              'stage',
              'data_layer',
              'filename',
              'path',
              'size_bytes',
              'size_human',
              'format',
              'description',
              'url',
              'sha256',
              'commit_sha',
              'generated_at',
          ]
          manifest = pd.read_csv(output_root / 'manifest.csv') if (output_root / 'manifest.csv').exists() else pd.DataFrame()
          manifest_schema_ok = manifest.columns.tolist() == manifest_columns
          portable_paths = bool(not manifest.empty and manifest['path'].str.startswith('outputs/').all())
          urls_ok = bool(not manifest.empty and manifest['url'].str.startswith('https://github.com/').all())
          descriptions_ok = bool(not manifest.empty and manifest['description'].fillna('').str.strip().ne('').all())
          sha256_ok = bool(not manifest.empty and manifest['sha256'].fillna('').str.fullmatch(r'[0-9a-f]{64}').all())
          commit_sha_ok = bool(not manifest.empty and manifest['commit_sha'].fillna('').str.len().ge(7).all())
          generated_at_ok = bool(not manifest.empty and manifest['generated_at'].fillna('').str.strip().ne('').all())

          regime_fits_path = output_root / 'tables/paper_distribution_regime_fits.csv'
          regime_curves_path = output_root / 'tables/paper_distribution_regime_curves.parquet'
          regime_fits = pd.read_csv(regime_fits_path) if regime_fits_path.exists() else pd.DataFrame()
          regime_curves = pd.read_parquet(regime_curves_path) if regime_curves_path.exists() else pd.DataFrame()
          required_fit_columns = {
              'year', 'cutoff', 'cutoff_quantile', 'n_total', 'n_body', 'n_tail', 'tail_fraction',
              'gompertz_A', 'gompertz_B', 'gompertz_r2', 'gompertz_rmse', 'gompertz_aic',
              'gompertz_bic', 'pareto_alpha_mle', 'pareto_ccdf_slope', 'pareto_intercept',
              'pareto_r2', 'pareto_rmse', 'pareto_aic', 'pareto_bic', 'pareto_ks',
              'joint_aic', 'joint_bic', 'fit_status',
          }
          required_curve_columns = {
              'year', 'income', 'empirical_ccdf', 'gompertz_transform', 'log_income',
              'log_empirical_ccdf', 'regime', 'cutoff', 'gompertz_fitted_transform',
              'gompertz_fitted_ccdf', 'pareto_fitted_ccdf', 'pareto_fitted_log_ccdf',
          }
          regime_fit_schema_ok = required_fit_columns.issubset(regime_fits.columns)
          regime_curve_schema_ok = required_curve_columns.issubset(regime_curves.columns)
          regime_years_ok = bool(
              'year' in regime_fits and len(regime_fits) == 45 and regime_fits['year'].is_unique
          )
          valid_regime_fits = int(regime_fits['fit_status'].astype(str).str.startswith('ok').sum()) if 'fit_status' in regime_fits else 0

          print('TRUSTED_FILE_COUNT', len(trusted_files))
          print('FIGURE_COUNT', len(figures))
          print('MISSING_REQUIRED', missing)
          print('NESTED_OUTPUT_DIRS', nested_output_dirs)
          print('UNPREFIXED_OUTPUTS', wrong_names)
          print('UNANNOTATED_LORENZ_OUTPUTS', forbidden_unannotated_lorenz)
          print('MANIFEST_ROWS', len(manifest))
          print('MANIFEST_SCHEMA_OK', manifest_schema_ok)
          print('MANIFEST_PORTABLE_PATHS', portable_paths)
          print('MANIFEST_URLS_OK', urls_ok)
          print('MANIFEST_DESCRIPTIONS_OK', descriptions_ok)
          print('MANIFEST_SHA256_OK', sha256_ok)
          print('MANIFEST_COMMIT_SHA_OK', commit_sha_ok)
          print('MANIFEST_GENERATED_AT_OK', generated_at_ok)
          print('REGIME_FIT_SCHEMA_OK', regime_fit_schema_ok)
          print('REGIME_CURVE_SCHEMA_OK', regime_curve_schema_ok)
          print('REGIME_YEARS_OK', regime_years_ok)
          print('VALID_REGIME_FITS', valid_regime_fits)

          if len(trusted_files) != 45:
              raise SystemExit(f'Expected 45 trusted annual Parquet files, found {len(trusted_files)}')
          if missing:
              raise SystemExit(1)
          if nested_output_dirs:
              raise SystemExit(1)
          if wrong_names:
              raise SystemExit(1)
          if forbidden_unannotated_lorenz:
              raise SystemExit(1)
          if len(figures) < 20:
              raise SystemExit(f'Expected at least 20 figures, found {len(figures)}')
          if not all([
              manifest_schema_ok,
              portable_paths,
              urls_ok,
              descriptions_ok,
              sha256_ok,
              commit_sha_ok,
              generated_at_ok,
              regime_fit_schema_ok,
              regime_curve_schema_ok,
              regime_years_ok,
          ]):
              raise SystemExit('Manifest audit failed.')
          PY

      - name: Upload generated outputs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pnad-trusted-data-and-outputs
          path: |
            data/trusted/
            outputs/
          if-no-files-found: error

      - name: Commit trusted data and generated outputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/trusted outputs/manifest.csv outputs/figures outputs/tables
          if git diff --cached --quiet; then
            echo 'No generated trusted-data or output changes to commit.'
            exit 0
          fi
          git commit -m 'update trusted PNAD data and generated outputs [skip ci]'
          git push origin HEAD:main
