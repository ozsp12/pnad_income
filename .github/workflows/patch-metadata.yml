name: Align metadata with manuscript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align exchange factors and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('config/pnad_metadata.csv')
          text = path.read_text(encoding='utf-8')
          before = text
          text = text.replace('Real R$,2.1686,352.08333', 'Real R$,2.1687,352.08333')
          text = text.replace('Real R$,1.7598,393.39757', 'Real R$,1.7498,393.39757')
          if text == before:
              raise SystemExit('Expected metadata values were not found; no changes made.')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/pnad_metadata.csv .github/workflows/patch-metadata.yml
          git commit -m 'align monetary metadata with manuscript [skip ci]'
          git push
