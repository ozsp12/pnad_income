[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnad-income"
version = "0.2.0"
description = "Reproducible analysis of Brazilian PNAD income distributions, 1976-2025"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyarrow>=14",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pnad-income = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["analysis", "cli", "data", "descriptive", "outputs", "pipeline", "plotting"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
